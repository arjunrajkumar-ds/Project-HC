function onPickQuery(v){ PICK_Q=v; document.getElementById('pick-results').innerHTML = pickResults(); }

function pickRow(e, meta, cls){
    return '<button type="button" class="pick" style="--g:'+mgColor(e.muscle_group)+'" onclick="openExercise('+e.id+')">'
        + '<span class="dot"></span><span class="pcol"><span class="pn">'+esc(e.name)+'</span>'
        + '<span class="pg">'+esc((e.muscle_label||e.muscle_group||'')+' · '+(e.function_label||e.function||''))+'</span></span>'
        + '<span class="pm'+(cls||'')+'">'+esc(meta)+'</span></button>';
}
function allLoggable(){
    return Object.keys(EX_BY_ID).map(k=>EX_BY_ID[k]).filter(e=>!e.is_fajin);
}
// The picker is scoped, and the scopes do not overlap: cardio is reachable
// ONLY through the Cardio button, and never shows up in search, recents or
// browse on the lifting side. That separation is the point of giving cardio
// its own door — letting it drift back into the general list would quietly
// undo it.
function pickPool(){
    return allLoggable().filter(e => PICK_SCOPE==='cardio'
        ? e.muscle_group==='cardio' : e.muscle_group!=='cardio');
}
function pickGroups(){
    return BANK.filter(g => PICK_SCOPE==='cardio' ? g.key==='cardio' : g.key!=='cardio');
}
function pickResults(){
    const q = PICK_Q.trim().toLowerCase();
    if(q){
        const hits = pickPool().filter(e=>e.name.toLowerCase().indexOf(q)>=0).slice(0,16);
        if(!hits.length) return '<div class="empty-note">Nothing matches “'+esc(PICK_Q)+'”</div>';
        return '<div class="sect">'+hits.length+' match'+(hits.length>1?'es':'')+'</div>'
            + hits.map(e=>{ const d=exDays(e);
                return pickRow(e, dayLabel(d), d===0?' live':((d===null||d>=7)?' stale':'')); }).join('');
    }
    if(PICK_BROWSE){
        const g = BANK.find(x=>x.key===PICK_BROWSE);
        if(!g) return '<div class="empty-note">Nothing in that group.</div>';
        return (PICK_SCOPE==='cardio' ? '' : '<button type="button" class="back-btn" onclick="setBrowse(null)">&lsaquo; All groups</button>')
            + g.functions.map(fn => '<div class="sect">'+esc(fn.label)+'</div>'
                + fn.exercises.map(x=>{ const e=EX_BY_ID[x.id], d=exDays(e);
                    return pickRow(e, dayLabel(d), d===0?' live':((d===null||d>=7)?' stale':'')); }).join('')).join('');
    }
    // Default view: what you already started, then what you reached for most
    // recently — freshest first, because mid-session you are coming back to
    // something, not shopping for the stalest thing in the bank.
    const started=[];
    const inScope = new Set(pickPool().map(e=>e.id));
    (LIVE.sets||[]).forEach(s=>{ if(s.exercise_id!==CURRENT && started.indexOf(s.exercise_id)<0
        && inScope.has(s.exercise_id)) started.push(s.exercise_id); });
    const cont = started.length
        ? '<div class="sect">Continue</div>' + started.map(id =>
            pickRow(EX_BY_ID[id], setsFor(id).length+' sets', ' live')).join('')
        : '';
    const recent = pickPool()
        .filter(e=>e.id!==CURRENT && started.indexOf(e.id)<0 && e.days_since!==null && e.days_since!==undefined)
        .sort((a,b)=>a.days_since-b.days_since).slice(0,5);
    const groups = pickGroups().map(g=>{
        const hit=groupSetCount(g.key), cov=COVERAGE.find(c=>c.key===g.key);
        const d = cov ? cov.days_since : null;
        return '<button type="button" class="pick" style="--g:'+mgColor(g.key)+'" onclick="setBrowse(\''+jsStr(g.key)+'\')">'
            + '<span class="dot"></span><span class="pcol"><span class="pn">'+esc(g.label)+'</span>'
            + '<span class="pg">'+g.functions.length+' function'+(g.functions.length===1?'':'s')+'</span></span>'
            + '<span class="pm'+(hit?' live':((d===null||d>=7)?' stale':''))+'">'
            + (hit ? hit+' today' : dayLabel(d))+'</span></button>';
    }).join('');
    return cont
        + (recent.length ? '<div class="sect">Recent</div>'
            + recent.map(e=>pickRow(e, dayLabel(exDays(e)))).join('') : '')
        + '<div class="sect">Browse by group</div>' + groups;
}

// ── Plate maths ──────────────────────────────────────────────────────────
// bar_kg rides the exercise's engagement blob (same place target_s lives), so
// an exercise without one simply says so rather than guessing from its name.
const PLATES = [25,20,15,10,5,2.5,1.25];
function openPlates(){
    const e=curEx(); if(!e) return;
    const w=parseFloat((document.getElementById('ws-w')||{}).value)||0;
    let body;
    if(!e.bar_kg){
        body = '<div class="empty-note">No bar weight set for this exercise.<br>'
             + 'Add <code>bar_kg</code> to it in the databank to get plate maths here.</div>';
    } else if(w <= e.bar_kg){
        body = '<div class="plate"><span class="pl">Bar</span><span class="pp">'+fmtW(e.bar_kg)+' kg</span></div>'
             + '<div class="empty-note">Target is at or under the bar — nothing to load.</div>';
    } else {
        let side=(w-e.bar_kg)/2; const counts={};
        PLATES.forEach(p=>{ while(side >= p-0.001){ counts[p]=(counts[p]||0)+1; side=Math.round((side-p)*100)/100; } });
        body = '<div class="plate"><span class="pl">Bar</span><span class="pp">'+fmtW(e.bar_kg)+' kg</span></div>'
             + Object.keys(counts).sort((a,b)=>b-a).map(k=>
                 '<div class="plate"><span class="pl">'+k+' kg</span><span class="pp">&times; '+counts[k]+' per side</span></div>').join('')
             + (side>0.01 ? '<div class="plate"><span class="pl" style="color:var(--red)">Unloadable</span>'
                 + '<span class="pp" style="color:var(--red)">'+fmtW(Math.round(side*200)/100)+' kg short</span></div>' : '');
    }
    document.getElementById('plate-panel').innerHTML =
        '<div class="sheet-h"><span class="sheet-title">Loading '+fmtW(w)+' kg</span>'
        + '<button type="button" class="sheet-close" onclick="closePlates()">&#10005;</button></div>'
        + body + '<button type="button" class="log-btn sec" onclick="closePlates()">Close</button>';
    document.getElementById('plate-sheet').classList.add('on');
}

// ── Session summary + finish ─────────────────────────────────────────────
// end_gym_session() has existed since the session tables were added but
// nothing ever called it, so ended_at was only ever stamped days late by the
// lazy roll-over. (REVIEW §2.3)
let finishArmed=false;
function openSummary(){
    finishArmed=false;
    renderSummary();
    document.getElementById('sum-sheet').classList.add('on');
}
function armFinish(){ finishArmed=true; renderSummary(); }
function renderSummary(){
    const sets=LIVE.sets||[], v=volume();
    const byG={};
    sets.forEach(s=>{ const k=s.muscle_group||'other';
        if(!byG[k]) byG[k]={n:0, names:[]};
        byG[k].n++; if(byG[k].names.indexOf(s.exercise_name)<0) byG[k].names.push(s.exercise_name); });
    const lift = Object.keys(byG).filter(k=>k!=='cardio').map(k=>
        '<div class="sumrow" style="--g:'+mgColor(k)+'"><span class="sg">'+esc(k)+'</span>'
        + '<span class="sx">'+esc(byG[k].names.join(', '))+'</span>'
        + '<span class="sn">'+byG[k].n+'</span></div>').join('');
    // Cardio is reported on its own line, in minutes — never folded into
    // lifting volume, because it is a different kind of work.
    const cSecs = sets.filter(s=>s.muscle_group==='cardio').reduce((a,s)=>a+(s.duration_s||0),0);
    const cardio = cSecs ? '<div class="sumrow" style="--g:'+mgColor('cardio')+'">'
        + '<span class="sg">Cardio</span><span class="sx">'+esc(byG.cardio.names.join(', '))+'</span>'
        + '<span class="sn">'+Math.round(cSecs/60)+' min</span></div>' : '';
    const missing = COVERAGE.filter(g=>g.every_session && !groupSetCount(g.key)).map(g=>g.label);
    const vol = v>=1000 ? (v/1000).toFixed(1)+'k' : Math.round(v);

    document.getElementById('sum-panel').innerHTML =
        '<div class="sheet-h"><span class="sheet-title">Session</span>'
        + '<span class="sheet-sub">'+(LIVE.session_id?('#'+LIVE.session_id):'not started')+'</span>'
        + '<button type="button" class="sheet-close" onclick="closeSummary()">&#10005;</button></div>'
        + '<div class="sumgrid">'
          + '<div class="sumcell"><div class="sv">'+sets.length+'</div><div class="sk">Sets</div></div>'
          + '<div class="sumcell"><div class="sv">'+vol+'</div><div class="sk">Volume kg</div></div>'
          + '<div class="sumcell"><div class="sv">'+Object.keys(byG).length+'</div><div class="sk">Groups</div></div>'
        + '</div>'
        + (lift+cardio || '<div class="empty-note">No sets logged yet.</div>')
        + (missing.length ? '<div class="sect">Still outstanding</div>'
            + '<div class="sumrow warn"><span class="sx">'+esc(missing.join(', '))
            + ' — every-session groups not hit</span></div>' : '')
        + (LIVE.session_id
            ? (finishArmed
                ? '<button type="button" class="log-btn danger" onclick="finishSession()">Tap again to finish</button>'
                  + '<div class="finish-note">Closes the session. Logging another set re-opens it.</div>'
                : '<button type="button" class="log-btn" onclick="armFinish()">Finish session</button>')
            : '')
        + '<button type="button" class="log-btn sec" onclick="closeSummary()">Keep going</button>';
}
function closeSummary(){ finishArmed=false; document.getElementById('sum-sheet').classList.remove('on'); }
async function finishSession(){
    finishArmed=false;
    // dateBody: a back-dated day finishes THAT day's session, not today's.
    const r=await apiPost('/api/gym/session/finish', dateBody({}));
    if(r.ok && r.data.ok){
        closeSummary(); stopRest();
        LIVE = r.data.workout_so_far || LIVE;
        renderAll();                                 // stage bar → finished (plays the complete wave)
        // The finish recap (Feature 02): animate the day's banked passes. A
        // cardio-only finish has an empty delta, so just toast. Both entry
        // points (summary sheet + stage bar Finish) land here.
        const delta = (r.data.accumulation_delta || []);
        if(delta.length){ openRecap(delta, r.data.day); }
        else { toast('Session finished.'); }
    } else { toast(r.offline ? 'No connection — not finished' : (r.data.error||'Could not finish the session')); }
}

// ── Re-sync when the page comes back ──────────────────────────────────────
// A phone locks mid-workout, or the same session is open on a second device.
// Without this the page keeps rendering whatever LIVE was at load time, so a
// set logged elsewhere (or a roll-over past 4 AM) never shows up and the
// counts silently drift from the database.
let resyncing = false;
async function resyncLive(){
    if(resyncing || logInFlight) return;
    resyncing = true;
    try {
        const r = await apiGet(withDate('/api/gym/live-session'));
        if(r.ok && r.data && Array.isArray(r.data.sets)){
            LIVE = r.data;
            if(!Array.isArray(LIVE.muscles)) LIVE.muscles = [];
            STAGE_SILENT = true; renderAll(); STAGE_SILENT = false;   // resync must not animate (§4.3)
        }
    } finally { resyncing = false; }
}
document.addEventListener('visibilitychange', ()=>{
    if(document.visibilityState==='visible') resyncLive();
});
window.addEventListener('pageshow', e=>{ if(e.persisted) resyncLive(); });


// ══════════════════════════════════════════════════════════════════════════
// Stage bar + Finish recap (Features 01 & 02). See docs/HANDOFF-stage-bar-
// recap-route.md §4-§5. The bar is a pure function of the day's sets + a small
// per-day manual state (Next/T2-open) + the session's `finished` flag; the DOM
// is built once and updated in place so CSS transitions animate (§4.3). This
// template is scheme-only (/train ∈ _SCHEME_ROUTES), so no engine check.
// ══════════════════════════════════════════════════════════════════════════
const T3_LBL = {sh:'SH', ar:'AR', co:'CO'};
const T3_C   = {sh:MG_COLORS.shoulders, ar:MG_COLORS.arms, co:MG_COLORS.core};
let STAGE_NODES = null;     // {el, chevs:[5], parts:{sh,ar,co}, nextBtn}
let STAGE_PREV  = null;     // diff snapshot of the last render (null = first paint)
let STAGE_SILENT = false;   // suppress one-shot animations (init/resync/day switch)
let STAGE_LAST  = null;     // last derived state, for the interaction handlers
let stageFinArmed = false, stageFinTimer = null;

// Per-day manual state: Next-marked done keys + whether optional T2 is unfolded.
// Keyed by the day so each back-dated day keeps its own (HANDOFF §4.2). try/catch
// like readRest()/writeRest() — sessionStorage can throw in private mode.
function stageManualKey(){ return 'train_stage_' + curDayIso(); }
function readStageManual(){
    try {
        const r = JSON.parse(sessionStorage.getItem(stageManualKey()) || 'null');
        if(r && typeof r === 'object')
            return {done: Array.isArray(r.done) ? r.done : [], t2Open: !!r.t2Open};
    } catch(e){}
    return {done: [], t2Open: false};
}
function writeStageManual(m){
    try { sessionStorage.setItem(stageManualKey(),
        JSON.stringify({done: m.done || [], t2Open: !!m.t2Open})); } catch(e){}
}

// Pure derivation (HANDOFF §4.2): no DOM, no globals read beyond its args.
function stageState(sets, manual, finished){
    sets = sets || [];
    manual = manual || {done:[], t2Open:false};
    const done = new Set(manual.done || []);
    const stages = [
        {key:'warm', k:'WARM-UP', name:'', sets:0, target:2, lastExerciseId:null},
        {key:'t1a',  k:'T1 · 1',  name:'', sets:0, target:3, lastExerciseId:null},
        {key:'t1b',  k:'T1 · 2',  name:'', sets:0, target:3, lastExerciseId:null},
        {key:'t2',   k:'T2',      name:'', sets:0, target:3, lastExerciseId:null, optional:true, open:false},
        {key:'t3',   k:'T3',      name:'', target:3, parts:{sh:0,ar:0,co:0}, names:{}, lastExerciseId:null},
    ];
    // t1a is the FIRST distinct t1 exercise_id in log order; a 2nd (or later)
    // distinct t1 lift is t1b. One lift in both slots collapses to a single T1.
    const t1ids = [];
    sets.forEach(s => { if(s.stage === 't1' && t1ids.indexOf(s.exercise_id) < 0) t1ids.push(s.exercise_id); });
    const t1aId = (t1ids.length ? t1ids[0] : null);
    sets.forEach(s => {
        const st = s.stage;
        if(st === 'warm'){ const g = stages[0]; g.sets++; g.name = s.exercise_name; g.lastExerciseId = s.exercise_id; }
        else if(st === 't1'){
            const g = (s.exercise_id === t1aId) ? stages[1] : stages[2];
            g.sets++; g.name = s.exercise_name; g.lastExerciseId = s.exercise_id;
        }
        else if(st === 't2'){ const g = stages[3]; g.sets++; g.name = s.exercise_name; g.lastExerciseId = s.exercise_id; }
        else if(st && st.indexOf('t3:') === 0){
            const part = st.slice(3), g = stages[4];
            if(g.parts[part] !== undefined){ g.parts[part]++; g.names[part] = s.exercise_name; }
            g.name = s.exercise_name; g.lastExerciseId = s.exercise_id;
        }
    });
    stages[3].open = stages[3].sets > 0 || !!manual.t2Open;
    const visible = i => !(stages[i].optional && !stages[i].open);

    let loggedIdx = 0;
    stages.forEach((g,i) => {
        const has = g.key === 't3' ? (g.parts.sh + g.parts.ar + g.parts.co > 0) : g.sets > 0;
        if(has) loggedIdx = i;
    });
    let doneIdx = -1;
    stages.forEach((g,i) => { if(done.has(g.key)) doneIdx = Math.max(doneIdx, i); });
    let nextAfterDone = 0;
    for(let i = doneIdx + 1; i < stages.length; i++){ if(visible(i)){ nextAfterDone = i; break; } }
    let active = Math.max(loggedIdx, nextAfterDone, 0);
    if(active > 4) active = 4;
    if(!visible(active)) active = 4;    // never rest on a folded T2

    stages.forEach((g,i) => {
        if(g.key === 't3') g.done = !!finished;              // T3 is done only when finished
        else g.done = done.has(g.key) || (visible(i) && i < active);
    });
    return {active, finished: !!finished, stages, visible: stages.map((_,i) => visible(i))};
}

// Build the DOM once (HANDOFF §4.3). renderStage() only toggles classes / text.
function makeStageBar(){
    const host = document.getElementById('stage-root');
    if(!host || STAGE_NODES) return;
    const el = document.createElement('div'); el.className = 'sb';
    el.innerHTML =
        '<div class="sb-cap"><span class="st"></span><span class="ex"></span><span class="ct"></span></div>'
      + '<div class="sb-row"><div class="sb-chevs"></div>'
      + '<button type="button" class="sb-next"><b>›</b><span>NEXT</span></button></div>';
    host.appendChild(el);
    const chevRow = el.querySelector('.sb-chevs');
    const base = stageState([], {done:[], t2Open:false}, false);
    const chevs = base.stages.map((st,i) => {
        const c = document.createElement('div');
        c.className = 'cv' + (st.key === 't3' ? ' t3' : '');
        c.style.setProperty('--i', i);
        if(st.key === 't3'){
            c.innerHTML = '<div class="parts">' + ['sh','ar','co'].map(part =>
                '<div class="part" data-p="' + part + '" style="--c:' + T3_C[part] + '">'
              + '<span class="pf"></span><span class="pl">' + T3_LBL[part] + '</span>'
              + '<span class="pn">0/3</span></div>').join('') + '</div>';
        } else {
            c.innerHTML = '<span class="fill"></span><span class="tx">'
              + '<span class="k">' + st.k + '<span class="ok">✓</span></span>'
              + '<span class="n"></span></span>';
        }
        c.addEventListener('click', () => onStageChevron(i));
        chevRow.appendChild(c);
        return c;
    });
    const parts = {}; ['sh','ar','co'].forEach(part => { parts[part] = chevs[4].querySelector('[data-p="' + part + '"]'); });
    const nextBtn = el.querySelector('.sb-next');
    nextBtn.addEventListener('click', onStageNext);
    STAGE_NODES = {el, chevs, parts, nextBtn};
}

function renderStage(){
    if(!STAGE_NODES){ makeStageBar(); if(!STAGE_NODES) return; }
    const manual = readStageManual();
    const S = stageState(LIVE.sets || [], manual, LIVE.finished);
    STAGE_LAST = S;
    const silent = STAGE_SILENT || STAGE_PREV === null;
    const prev = STAGE_PREV || {done:new Set(), active:-1, t2Open:false, parts3:{sh:false,ar:false,co:false}, finished:false};
    const nowDone = new Set(S.stages.filter(s => s.done).map(s => s.key));

    S.stages.forEach((st,i) => {
        const n = STAGE_NODES.chevs[i];
        const folded = !!(st.optional && !st.open);
        n.classList.toggle('fold', folded);
        n.classList.toggle('active', i === S.active && !S.finished && !folded);
        n.classList.toggle('done', st.done && st.key !== 't3');
        if(st.key === 't3'){
            ['sh','ar','co'].forEach(part => {
                const v = st.parts[part], node = STAGE_NODES.parts[part];
                node.querySelector('.pf').style.height = (st.done && v === 0 ? 0 : Math.min(v/3,1)*100) + '%';
                node.querySelector('.pn').textContent = v + '/3';
                node.classList.toggle('hit', v > 0);
                node.classList.toggle('full', v >= 3);
                if(!silent && v >= 3 && !prev.parts3[part]){ oneShot(node, 'just', 700); }
            });
        } else {
            n.querySelector('.fill').style.width = (st.done ? 100 : Math.min(st.sets/st.target,1)*100) + '%';
            n.querySelector('.n').textContent = st.name || (st.optional ? 'optional' : (i === 0 ? '—' : 'pick a lift'));
            if(!silent && nowDone.has(st.key) && !prev.done.has(st.key)) oneShot(n, 'just-done', 1200);
        }
    });

    // one-shots that are not per-node fill (§4.3)
    if(!silent){
        if(S.active > prev.active){ oneShot(STAGE_NODES.chevs[S.active], 'arrive', 1300); }
        if(S.stages[3].open && !prev.t2Open){ oneShot(STAGE_NODES.chevs[3], 'unfold', 800); }
        if(S.finished && !prev.finished){ oneShot(STAGE_NODES.el, 'complete', 1400); }
    }

    // caption + Next/Finish button
    const a = S.stages[S.active];
    const visCount = S.visible.filter(Boolean).length;
    let visIndex = 0; for(let i = 0; i <= S.active; i++){ if(S.visible[i]) visIndex++; }
    STAGE_NODES.el.querySelector('.st').textContent =
        S.finished ? 'Session done' : ('Stage ' + visIndex + ' / ' + visCount);
    let exTxt, ct;
    if(S.finished){ exTxt = 'All stages complete'; ct = ''; }
    else if(a.key === 't3'){
        const hit = ['sh','ar','co'].filter(p => a.parts[p] > 0).length;
        exTxt = a.name ? ('T3 · ' + a.name) : 'T3 · shoulders, arms, core';
        ct = hit + ' / 3 groups';
    } else {
        exTxt = (a.key === 'warm' ? 'Warm-up' : a.k.replace(' · ', ' #')) + (a.name ? ' · ' + a.name : '');
        ct = a.sets + ' / ' + a.target + ' sets';
    }
    STAGE_NODES.el.querySelector('.ex').textContent = exTxt;
    STAGE_NODES.el.querySelector('.ct').textContent = ct;

    const atFinish = S.active === 4 && !S.finished;
    const btn = STAGE_NODES.nextBtn;
    btn.classList.toggle('fin', atFinish && !stageFinArmed);
    btn.classList.toggle('armed', atFinish && stageFinArmed);
    btn.style.opacity = S.finished ? .45 : 1;
    if(S.finished) btn.innerHTML = '<b>✓</b><span>DONE</span>';
    else if(atFinish && stageFinArmed) btn.innerHTML = '<b>!</b><span>Tap again</span>';
    else if(atFinish) btn.innerHTML = '<b>✓</b><span>FINISH</span>';
    else btn.innerHTML = '<b>›</b><span>NEXT</span>';

    STAGE_PREV = {done: nowDone, active: S.active, t2Open: S.stages[3].open,
        parts3: {sh: S.stages[4].parts.sh >= 3, ar: S.stages[4].parts.ar >= 3, co: S.stages[4].parts.co >= 3},
        finished: S.finished};
}
// Replay a one-shot animation class on a node (remove→reflow→add→cleanup).
function oneShot(node, cls, ms){
    node.classList.remove(cls); void node.offsetWidth; node.classList.add(cls);
    setTimeout(() => node.classList.remove(cls), ms);
}

function onStageNext(){
    const S = STAGE_LAST; if(!S || S.finished) return;              // DONE → disabled
    if(S.active === 4){                                             // T3 → Finish (two-tap)
        if(!LIVE.session_id){ toast('No session yet'); return; }
        if(!stageFinArmed){
            stageFinArmed = true; renderStage();
            clearTimeout(stageFinTimer);
            stageFinTimer = setTimeout(() => { stageFinArmed = false; renderStage(); }, 3000);
            return;
        }
        clearTimeout(stageFinTimer); stageFinArmed = false;
        finishSession();
        return;
    }
    const key = S.stages[S.active].key;                            // Next → mark active done
    const m = readStageManual();
    if((m.done || []).indexOf(key) < 0){ m.done = (m.done || []).concat([key]); writeStageManual(m); }
    renderStage();
}
function onStageChevron(i){
    const S = STAGE_LAST; if(!S) return;
    const st = S.stages[i];
    if(st.optional && !st.open){                                   // folded T2 → unfold
        const m = readStageManual(); m.t2Open = true; writeStageManual(m); renderStage(); return;
    }
    if(st.lastExerciseId && EX_BY_ID[st.lastExerciseId]) openExercise(st.lastExerciseId);
}

// ── Finish recap (Feature 02, HANDOFF §5.3) ────────────────────────────────
// Uppercase day label for the recap header, e.g. "SUN 18 OCT". A separate
// helper from fmtDayLabel() (which is title case + "Today"); _fmt_date (server)
// is untouched per the handoff clarification.
function recapDayLabel(iso){
    const [y,m,d] = iso.split('-').map(Number);
    const dt = new Date(Date.UTC(y, m-1, d));
    const dow = ['SUN','MON','TUE','WED','THU','FRI','SAT'][dt.getUTCDay()];
    const mon = ['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'][m-1];
    return dow + ' ' + d + ' ' + mon;
}
function fmtDayReps(reps){
    if(!reps || !reps.length) return '';
    const all = reps.every(r => r === reps[0]);
    return all ? (reps.length + '×' + reps[0]) : reps.join(',');
}
let RECAP_TIMERS = [], RECAP_PLAN = null;
const RECAP_REDUCE = matchMedia('(prefers-reduced-motion: reduce)').matches;

function openRecap(delta, day){
    day = day || curDayIso();
    const isToday = (day === ACTUAL_TODAY);
    const panel = document.getElementById('recap-panel');
    panel.innerHTML =
        '<div class="grab"></div>'
      + '<div class="rc-k">Session banked · ' + recapDayLabel(day) + '</div>'
      + '<div class="rc-head"><div class="rc-big"><span id="rc-count">+0</span><small>passes</small></div>'
      + '<div class="rc-mast"><b id="rc-mcount">0</b>rungs mastered</div></div>'
      + '<div class="rc-note">' + (isToday ? 'Today now counts on the home panel.'
                                            : 'Already counted on the home panel.') + '</div>'
      + '<div id="rc-list"></div>'
      + '<button type="button" class="log-btn" onclick="closeRecap()">Done</button>';
    RECAP_PLAN = buildRecapBlocks(delta);
    document.getElementById('recap-sheet').classList.add('on');   // rcUp slide-up
    playRecap();
}
function buildRecapBlocks(delta){
    const list = document.getElementById('rc-list'); list.innerHTML = '';
    const blocks = [];
    (delta || []).forEach(item => {
        const T = item.T || 5;
        const box = document.createElement('div'); box.className = 'rc-ex';
        box.innerHTML =
            '<div class="rc-exh"><span class="nm">' + esc(item.name) + '</span>'
          + '<span class="wt">' + esc(item.weight_label) + '</span>'
          + '<span class="dl">' + fmtDayReps(item.day_reps) + ' · +' + item.gained + '</span></div>'
          + '<div class="rungs"></div><div class="mt-wrap"></div>';
        const rungs = box.querySelector('.rungs');
        const cells = (item.cols || []).map(c => {
            const rung = document.createElement('div'); rung.className = 'rung';
            const cell = document.createElement('div'); cell.className = 'rcell';
            const changed = c.after > c.before;
            if(!changed) cell.classList.add('quiet');
            if(c.before === 0 && c.after === 0) cell.classList.add('none');
            if(c.before >= T) cell.classList.add('mastered');
            const shown = Math.min(T, c.after);
            for(let p = 0; p < T; p++){
                const pip = document.createElement('span'); pip.className = 'pip';
                if(p < Math.min(c.before, T)) pip.classList.add('on');
                else if(p < shown) pip.classList.add('new');
                cell.appendChild(pip);
            }
            if(c.before > T){ const o = document.createElement('span'); o.className = 'ovf'; o.textContent = '+' + (c.before - T); cell.appendChild(o); }
            rung.appendChild(cell);
            const l = document.createElement('span'); l.className = 'rl' + (changed ? ' hot' : ''); l.textContent = c.label;
            rung.appendChild(l);
            rungs.appendChild(rung);
            return {cell, changed, before: c.before, after: c.after, label: c.label, T};
        });
        list.appendChild(box);
        blocks.push({box, cells});
    });
    return blocks;
}
function playRecap(){
    RECAP_TIMERS.forEach(clearTimeout); RECAP_TIMERS = [];
    const plan = RECAP_PLAN; if(!plan) return;
    const countEl = document.getElementById('rc-count'), mEl = document.getElementById('rc-mcount');
    if(RECAP_REDUCE){ recapSnapFinal(); return; }
    countEl.textContent = '+0'; mEl.textContent = '0';
    let count = 0, mast = 0;
    const at = (ms, fn) => RECAP_TIMERS.push(setTimeout(fn, ms));
    let t = 650;
    plan.forEach(({box, cells}) => {
        at(t, () => box.classList.add('in')); t += 380;
        cells.filter(c => c.changed).forEach(c => {
            const news = [].slice.call(c.cell.querySelectorAll('.pip.new'));
            const extra = (c.after - c.before) - news.length;         // overflow passes past T
            news.forEach(pip => { at(t, () => { pip.classList.add('land'); count++; countEl.textContent = '+' + count; }); t += 150; });
            for(let x = 0; x < extra; x++){ at(t, () => { count++; countEl.textContent = '+' + count;
                let o = c.cell.querySelector('.ovf'); if(!o){ o = document.createElement('span'); o.className = 'ovf'; c.cell.appendChild(o); } o.textContent = '+' + (c.after - c.T); }); t += 150; }
            if(c.before < c.T && c.after >= c.T){
                at(t + 120, () => { c.cell.classList.add('mastered','flood'); mast++;
                    mEl.textContent = mast; mEl.classList.remove('bump'); void mEl.offsetWidth; mEl.classList.add('bump');
                    const tag = document.createElement('div'); tag.className = 'mtag'; tag.textContent = 'MASTERED ' + c.label;
                    c.cell.closest('.rc-ex').querySelector('.mt-wrap').appendChild(tag);
                    requestAnimationFrame(() => requestAnimationFrame(() => tag.classList.add('in'))); });
                t += 650;
            }
        });
        t += 260;
    });
}
// Snap to the final state at once (reduced motion, or Done/scrim/reopen).
function recapSnapFinal(){
    const plan = RECAP_PLAN; if(!plan) return;
    let count = 0, mast = 0;
    plan.forEach(({box, cells}) => {
        box.classList.add('in');
        cells.forEach(c => {
            if(!c.changed) return;
            count += c.after - c.before;
            [].slice.call(c.cell.querySelectorAll('.pip.new')).forEach(p => p.classList.add('land'));
            if(c.after > c.T){ let o = c.cell.querySelector('.ovf'); if(!o){ o = document.createElement('span'); o.className = 'ovf'; c.cell.appendChild(o); } o.textContent = '+' + (c.after - c.T); }
            if(c.before < c.T && c.after >= c.T){
                c.cell.classList.add('mastered'); mast++;
                const w = c.cell.closest('.rc-ex').querySelector('.mt-wrap');
                if(!w.querySelector('.mtag')){ const tag = document.createElement('div'); tag.className = 'mtag in'; tag.textContent = 'MASTERED ' + c.label; w.appendChild(tag); }
            }
        });
    });
    const countEl = document.getElementById('rc-count'), mEl = document.getElementById('rc-mcount');
    if(countEl) countEl.textContent = '+' + count;
    if(mEl) mEl.textContent = mast;
}
function closeRecap(){
    RECAP_TIMERS.forEach(clearTimeout); RECAP_TIMERS = [];
    recapSnapFinal();
    document.getElementById('recap-sheet').classList.remove('on');
}

// ── Init ──────────────────────────────────────────────────────────────────
// Open on where the session left off; failing that, on the thing lifted most
// recently, so the page is never a blank shell waiting for a decision.
(function init(){
    if(!Array.isArray(LIVE.sets)) LIVE.sets = [];
    if(!Array.isArray(LIVE.muscles)) LIVE.muscles = [];
    renderDateHeader();
    let start = LIVE.current_exercise_id;
    if(!start || !EX_BY_ID[start]){
        const pool = allLoggable().filter(e=>e.muscle_group!=='cardio'
            && e.days_since!==null && e.days_since!==undefined);
        pool.sort((a,b)=>a.days_since-b.days_since);
        start = pool.length ? pool[0].id : null;
    }
    readRest();
    makeStageBar();
    STAGE_SILENT = true; renderStage(); STAGE_SILENT = false;   // first paint is a silent baseline (§4.3)
    if(start) openExercise(start); else renderAll();
})();
</script>
